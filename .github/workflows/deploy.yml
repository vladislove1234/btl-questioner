name: Deploy to GitHub Pages

# Manual only for now: the vladislove1234 account is locked for billing, so Actions jobs
# don't start. Until that's fixed, deploy with `npm run deploy` (pushes dist/ to gh-pages).
# To switch back: restore `push: branches: [main]`, then set Pages source to "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUBMIT_URL: ${{ secrets.VITE_SUBMIT_URL }}
          VITE_SUBMIT_TOKEN: ${{ secrets.VITE_SUBMIT_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
